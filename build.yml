name: WISH — собрать приложение

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Скачать исходники
        uses: actions/checkout@v4
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Установить зависимости проекта
        run: npm install
      - name: Собрать WISH.exe
        run: npm run build:win
      - name: Опубликовать готовое приложение
        uses: actions/upload-artifact@v4
        with:
          name: WISH-Windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
